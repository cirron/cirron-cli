version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release"
    labels:
      - "dependencies"
      - "patch"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "release"
    labels:
      - "dependencies"
      - "patch"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    ignore:
      # 1.9.3 was published without its dist/ build, so the package can't be loaded
      - dependency-name: "@dsnp/parquetjs"
        versions: ["1.9.3"]
