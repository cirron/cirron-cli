name: Release

on:
  push:
    branches: [main]

# Prevent a publish loop: skip when the head commit was made by auto / a release bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Gated behind the "release" GitHub Environment so an approval/protection rule can be added.
    environment: release
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: write       # push the version bump commit + tag, create the GitHub release
      issues: write         # auto comments on issues fixed by the release
      pull-requests: write  # auto comments on released PRs
      id-token: write       # npm provenance + trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Until trusted publishing is configured on npmjs, fall back to an automation token.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attach build provenance to the published package.
          NPM_CONFIG_PROVENANCE: "true"
        run: npx auto shipit
