name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Gated behind the "release" GitHub Environment so an approval/protection rule can be added.
    environment: release
    # Prevent a publish loop: `auto`'s release commits are authored by
    # actions@github.com, so we filter those out here. This is more robust than
    # matching on commit message (which would false-positive on PRs that describe
    # skip-release behavior).
    if: github.event.head_commit.author.email != 'actions@github.com'
    permissions:
      contents: write       # push the version bump commit + tag, create the GitHub release
      issues: write         # auto comments on issues fixed by the release
      pull-requests: write  # auto comments on released PRs
      id-token: write       # OIDC for npm trusted publishing + build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN. The package on
      # npmjs.com must have a trusted publisher configured for this repo + workflow,
      # and "Require two-factor authentication and disallow tokens" is the matching
      # publishing-access setting. Provenance is attached automatically.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx auto shipit
